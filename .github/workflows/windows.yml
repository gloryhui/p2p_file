name: Windows full NAT and storage tests

on:
  # Final candidate branch is pushed once local validation is complete.
  # PR checks are sufficient; avoid duplicate push runs for the same head.
  pull_request:
  workflow_dispatch:

jobs:
  windows-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all Rust tests on Windows
        run: cargo test --all-targets --no-fail-fast
