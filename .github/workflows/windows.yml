name: Windows full NAT and storage tests

on:
  push:
  pull_request:

jobs:
  windows-all:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all Rust tests on Windows
        run: cargo test --all-targets --no-fail-fast
