name: GPUI desktop build matrix

on:
  # Final candidate branch is pushed once local validation is complete.
  # PR checks are sufficient; avoid duplicate push runs for the same head.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpui-check:
    name: GPUI check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: p2p-desktop
            packages: >-
              pkg-config libfontconfig1-dev libfreetype6-dev libwayland-dev
              libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev
              libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev
              libxkbcommon-dev libxkbcommon-x11-dev
              xvfb openbox xdotool x11-utils python3-dbus python3-gi mesa-vulkan-drivers
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: p2p-desktop.exe
            packages: ""
          - os: macos-14
            target: aarch64-apple-darwin
            executable: p2p-desktop
            packages: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: p2p-desktop
            packages: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Linux GPUI development packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check packaging validation boundaries
        run: python scripts/package-desktop-tests.py
      - name: Check Intel Mac native environment and prerequisite gates
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          python scripts/macos-intel-packaging-tests.py
          ./packaging/macos-x86_64/doctor.sh
      - name: Check native desktop shell
        run: cargo check --locked --features gui --bin p2p-desktop --target ${{ matrix.target }}
      - name: Build native desktop shell
        run: cargo build --locked --features gui --bin p2p-desktop --target ${{ matrix.target }}
      - name: Verify native X11 background lifetime with isolated SNI host
        if: runner.os == 'Linux'
        run: >-
          dbus-run-session -- /usr/bin/python3 scripts/desktop-background-smoke.py
          --binary target/${{ matrix.target }}/debug/p2p-desktop
          --output "${{ runner.temp }}/p2p-background-smoke"
      - name: Configure macOS loopback alias for RFC 5780 fixtures
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Run full GUI library regressions
        run: "cargo test --locked --features gui --lib --target ${{ matrix.target }}"
      - name: Run native IPv6 loopback regressions with capability diagnostics
        run: "cargo test --locked --features gui ipv6 --lib --target ${{ matrix.target }} -- --nocapture"
      - name: Run local authenticated Relay regressions (native IPv4/IPv6, no public network)
        run: "cargo test --locked --features gui relay_ --lib --target ${{ matrix.target }} -- --nocapture"
      - name: Run IPv6 CLI send regression
        run: "cargo test --locked --test ipv6_cli_send --target ${{ matrix.target }} -- --nocapture"
      - name: Run GUI Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --features gui --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build optimized native candidate
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: cargo build --locked --release --features gui --bin p2p-desktop --target ${{ matrix.target }}
      - name: Package and verify the literal-head native candidate
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          python scripts/package-desktop.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --output "${{ runner.temp }}/p2p-desktop-candidate"
          python scripts/verify-desktop-package.py "${{ runner.temp }}/p2p-desktop-candidate/candidate.json"
      - name: Verify the native Intel Mac build and packaging entrypoint
        if: matrix.target == 'x86_64-apple-darwin'
        run: ./packaging/macos-x86_64/build.sh --output "${{ runner.temp }}/p2p-desktop-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-desktop-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/p2p-desktop-candidate/*.tar.gz
            ${{ runner.temp }}/p2p-desktop-candidate/*.zip
            ${{ runner.temp }}/p2p-desktop-candidate/*.sha256
            ${{ runner.temp }}/p2p-desktop-candidate/candidate.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Package lightweight macOS app with license material
        if: runner.os == 'macOS'
        run: |
          python scripts/package-desktop.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --target ${{ matrix.target }} --output "${{ runner.temp }}/p2p-desktop-app-only" --app-only
          cd "${{ runner.temp }}/p2p-desktop-app-only"
          ditto -c -k --keepParent "P2P File.app" "p2p-desktop-app-only-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}.zip"
          shasum -a256 "p2p-desktop-app-only-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}.zip" > "p2p-desktop-app-only-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: p2p-desktop-app-only-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/p2p-desktop-app-only/*.zip
            ${{ runner.temp }}/p2p-desktop-app-only/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
