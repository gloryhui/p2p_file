[package]
name = "p2p_file"
version = "0.1.0"
edition = "2024"
description = "点对点文件传输：STUN 发现 + UDP 打洞 + QUIC 加密通道"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.3"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.12"
rand = "0.10.3"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
