[package]
name = "p2p_file"
version = "0.1.0"
edition = "2024"
description = "点对点直连：STUN 发现 + UDP 打洞 + QUIC 加密通道，支持文件传输与通用 TCP 隧道"
repository = "https://github.com/gloryhui/p2p_file"
readme = "README.md"
keywords = ["p2p", "nat-traversal", "quic", "file-transfer", "tunnel"]
categories = ["network-programming"]
license = "MIT"

[features]
default = []
gui = [
    "dep:dirs",
    "dep:cap-std",
    "dep:cap-fs-ext",
    "dep:unicode-normalization",
    "dep:rustix",
    "dep:gpui",
    "dep:serde_json",
    "dep:unicode-segmentation",
]

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.3"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.12"
rand = "0.10.3"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gpui = { version = "=0.2.2", optional = true }
dirs = { version = "=5.0.1", optional = true }
serde_json = { version = "=1.0.151", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
cap-std = { version = "=3.4.6", optional = true }
cap-fs-ext = { version = "=3.4.6", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }

[[bin]]
name = "p2p-desktop"
path = "src/bin/p2p-desktop.rs"
required-features = ["gui"]

[target."cfg(unix)".dependencies]
rustix = { version = "=1.1.5", features = ["fs"], optional = true }
