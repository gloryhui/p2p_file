[package]
name = "p2p_file"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "点对点直连：IPv4/IPv6 NAT 穿透 + QUIC，支持文件传输、TCP 隧道与端到端加密 UDP Relay 兜底"
repository = "https://github.com/gloryhui/p2p_file"
readme = "README.md"
keywords = ["p2p", "nat-traversal", "quic", "file-transfer", "tunnel"]
categories = ["network-programming"]
license = "MIT"

[features]
default = []
gui = [
    "dep:argon2",
    "dep:hmac",
    "dep:sha2",
    "dep:getrandom",
    "dep:dirs",
    "dep:cap-std",
    "dep:cap-fs-ext",
    "dep:unicode-normalization",
    "dep:rustix",
    "dep:gpui",
    "dep:serde_json",
    "dep:unicode-segmentation",
    "dep:raw-window-handle",
    "dep:tray-icon",
    "dep:ksni",
    "dep:x11rb",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:windows-sys",
    "dep:notify-rust",
]

[dependencies]
notify-rust = { version = "=4.18.1", features = ["preview-macos-un"], optional = true }
socket2 = "0.6.5"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
argon2 = { version = "=0.5.3", optional = true }
hmac = { version = "=0.12.1", optional = true }
sha2 = { version = "=0.10.9", optional = true }
zeroize = { version = "1.8", features = ["derive"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "=1.0.9"
getrandom = { version = "0.4", optional = true }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.3"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.12"
rand = "0.10.3"
rcgen = "0.14.10"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gpui = { version = "=0.2.2", optional = true }
dirs = { version = "=5.0.1", optional = true }
serde_json = { version = "=1.0.151", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }
cap-std = { version = "=3.4.6", optional = true }
cap-fs-ext = { version = "=3.4.6", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }
unicode-normalization = { version = "=0.1.25", optional = true }

[build-dependencies]
embed-resource = "=3.0.11"

[[bin]]
name = "p2p-desktop"
path = "src/bin/p2p-desktop.rs"
required-features = ["gui"]

[target."cfg(unix)".dependencies]
rustix = { version = "=1.1.5", features = ["fs"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.24.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.2", features = ["blocking"], optional = true }
x11rb = { version = "=0.13.2", optional = true }
